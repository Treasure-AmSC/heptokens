---
_target_: heptokens.data.event_mappable.EventSingleFileMapModule

# Data path
data_path: /path/to/event_data.h5

# Split ratios (must sum to 1.0)
train_frac: 0.7
val_frac: 0.15
test_frac: 0.15

# Random seed for reproducible splits
seed: 42

# Number of classes (1 = no event-level classification task yet)
n_classes: 1

# DataLoader settings
num_workers: 3
batch_size: 1024
pin_memory: false
persistent_workers: false
multiprocessing_context:
# No transforms initially -- event-level preprocessing TBD
transforms:
# Dataset-specific config (passed to EventMapDataset via **data_config)
particle_features: [pt, eta, phi]

# Optional limits
num_events:  # Use all events
num_particles: 200  # Match MAX_PARTICLES_PER_EVENT from convert_xaod_to_h5.py
