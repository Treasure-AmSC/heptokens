---
_target_: gdig.data.atlas_mappable.SingleFileMapModule

# Data path
data_path: /sdf/scratch/users/s/samklein/data/atlas/mc-flavtag-ttbar-small.h5

# Split ratios (must sum to 1.0)
train_frac: 0.7
val_frac: 0.15
test_frac: 0.15

# Random seed for reproducible splits
seed: 42

# Number of classes
n_classes: 3

# DataLoader settings
num_workers: 4
batch_size: 1024
pin_memory: true
# Optional transforms (instantiated separately)  TODO: improve this
transforms:
  - _target_: gdig.data.preprocessing.preprocess_batch
    _partial_: true
    cst_fn:
      _target_: joblib.load
      filename: /sdf/scratch/users/s/samklein/data/atlas/resources/cst_quantiles.joblib
    jet_fn:
      _target_: joblib.load
      filename: /sdf/scratch/users/s/samklein/data/atlas/resources/jet_quantiles.joblib
# Dataset-specific config (passed to MapDataset via **data_config)
jet_features: [pt, mass]
cst_features:
  - pt
  - deta
  - dphi
  - d0
# Optional limits
num_jets:  # Use all jets
num_csts:  # Use all constituents per jet
