---
_target_: heptokens.data.atlas_mappable.SingleFileMapModule

# Data path
data_path: /sdf/scratch/users/j/jkrupa/data/atlas/mc-flavtag-ttbar-medium.h5

# Split ratios (must sum to 1.0)
train_frac: 0.7
val_frac: 0.15
test_frac: 0.15

# Random seed for reproducible splits
seed: 42

# Number of classes
n_classes: 4

# DataLoader settings
num_workers: 3
batch_size: 1024
pin_memory: false
persistent_workers: false
multiprocessing_context: 
# Optional transforms (instantiated separately)  TODO: improve this
transforms:
  preprocess:
    _target_: heptokens.data.collation.preprocess_batch
    _partial_: true
    cst_fn:
      _target_: joblib.load
      filename: /path/to/cst_quantiles.joblib
    jet_fn:
      _target_: joblib.load
      filename: /path/to/jet_quantiles.joblib
# Dataset-specific config (passed to MapDataset via **data_config)
label_key: HadronConeExclTruthLabelID
max_jet_pt: 7.0e6
max_cst_pt: 1.0e6
jet_features: [pt, mass, eta, phi]
cst_features:
  - pt
  - deta
  - dphi
  - d0
  - d0RelativeToBeamspot
  - d0Uncertainty
  - d0RelativeToBeamspotUncertainty
  - z0RelativeToBeamspot
  - z0RelativeToBeamspotUncertainty
  - z0SinTheta
  - z0SinThetaUncertainty
  - lifetimeSignedD0 
  - lifetimeSignedD0Significance
  - lifetimeSignedZ0SinTheta
  - lifetimeSignedZ0SinThetaSignificance
  - theta
  - thetaUncertainty
  - qOverP
  - qOverPUncertainty
  - ptfrac
# Optional limits
num_jets:  # Use all jets
num_csts: 40  # Use all constituents per jet
