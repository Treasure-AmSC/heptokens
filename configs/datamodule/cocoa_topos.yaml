---
_target_: heptokens.data.cocoa_topos.COCOATopoModule

# Data directory containing train/val/test subdirectories
data_dir: /fs/ddn/sdf/group/atlas/d/jkrupa/treasure/4m/data_new/COCOA_samples_singlejet
train_dir: train_topup2_20M_cells256
val_dir: val_100K_cells256
test_dir: test_1M_cells256_isInfFalse

# Topo cluster features
features:
  - topo_eta
  - topo_phi
  - topo_e
  - topo_rho
  - topo_sigma_eta
  - topo_sigma_phi
  - topo_ecal_e
  - topo_hcal_e

# Maximum topo clusters per event (pad/truncate)
max_csts: 50

# DataLoader settings
batch_size: 1024
num_workers: 4
pin_memory: true
persistent_workers: true

# Optional: limit number of events loaded per split
num_events:

# Optional transforms (preprocessing)
transforms:
  preprocess:
    _target_: heptokens.data.collation.preprocess_batch
    _partial_: true
    cst_fn:
      _target_: joblib.load
      filename: /sdf/data/atlas/u/jkrupa/heptokens/resources/cocoa_topo_log_standard.joblib
