---
_target_: heptokens.data.cocoa_truthpart.COCOATruthPartModule

# Data directory containing train/val/test subdirectories
data_dir: /fs/ddn/sdf/group/atlas/d/jkrupa/treasure/4m/data_new/COCOA_samples_singlejet
train_dir: train_topup2_20M_cells256
val_dir: val_100K_cells256
test_dir: test_1M_cells256_isInfFalse

# Continuous truth-particle features (order fixes recon indices: pt=0, eta=1, phi=2, e=3).
# The 3-way particle class (charged/neutral-hadron/photon) is emitted separately
# as an integer `class_labels` channel and consumed by the model's categorical head.
features:
  - particle_pt
  - particle_eta
  - particle_phi
  - particle_e

# Maximum truth particles per event (pad/truncate). Multiplicity is small
# (median ~6, 99th percentile ~15).
max_csts: 16

# DataLoader settings
batch_size: 1024
num_workers: 4
pin_memory: true
persistent_workers: true

# Optional: limit number of events loaded per split
num_events:

# Optional transforms (preprocessing)
transforms:
  preprocess:
    _target_: heptokens.data.collation.preprocess_batch
    _partial_: true
    cst_fn:
      _target_: joblib.load
      filename: /sdf/data/atlas/u/jkrupa/heptokens/resources/cocoa_truthpart_log_standard.joblib
