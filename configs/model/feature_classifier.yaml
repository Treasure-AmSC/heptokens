---
_target_: heptokens.models.token_classifier.FeatureClassifier
d_model: 128
n_heads: 8
num_layers: 4
dim_feedforward: 512
dropout: 0.0
activation: gelu
pooling: mean
learning_rate: 1.0e-4
optimizer:
  _target_: heptokens.models.optimisers.AdamWS
  _partial_: true
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.01
scheduler:
  _target_: heptokens.models.utils.linear_warmup_cosine_decay
  _partial_: true
  warmup_steps: 1000
  total_steps: -1
lr_interval: step
