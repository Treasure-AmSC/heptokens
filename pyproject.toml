[project]
name = "gdig"
version = "0.1.0"
authors = [{ name = "Samuel Klein", email = "samuel.byrne.klein@gmail.com" }]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["pytorch", "nvidia", "conda-forge", "pypi"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
gdig = { path = ".", editable = true }

[tool.pixi.dependencies]
pre-commit = ">=4.3.0,<5"
# PyTorch with CUDA support
pytorch = { version = ">=2.4", channel = "pytorch" }
torchvision = { version = ">=0.19", channel = "pytorch" }
torchaudio = { version = ">=2.4", channel = "pytorch" }
lightning = ">=2.5.5,<3"
omegaconf = ">=2.3.0,<3"
h5py = ">=3.13.0,<4"
hydra-core = ">=1.3.2,<2"

[tool.pixi.tasks]
# Define useful developer tasks (optional)
lint = "pre-commit run --all-files"
